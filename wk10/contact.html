<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <div>
      <header>
        <img src="logo.jpg">
        <h2>
            Contact Us
        </h2>
        <p>
            Please complete the following form.
        </p>
      </header>
      <main>
<div class="form-group">
        <form method="post" action="https://webdevbasics.net/scripts/demo.php">
            <label for="FirstName">First Name</label>
                <input type="text" id="FirstName" name="FirstName" maxlength="30" required>
                 <label for="LastName">Last Name</label>
                <input type="text" id="LastName" name="LastName" maxlength="30" required>

</div>
<div class="form-group">
            <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
</div>
<div class="form-group">
            <label for="email">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
</div>

<div class="form-group">
            <label>How would you prefer we contact you?</label>
            <div class="contact-options">
                <div class="radio-option">
                <input type="radio" id="contactEmail" name="contactPreference" value="Email"required>
                <label for="contactEmail">Email</label>
                </div>

                  <div class="contact-options">
                <div class="radio-option">
                <input type="radio" id="Text" name="contactPreference" value="phone"required>
                <label for="Text">Text</label>
                </div>

                  <div class="contact-options">
                <div class="radio-option">
                <input type="radio" id="contact" name="contactPreference" value="Email"required>
                <label for="contactEmail">No Preference</label>
                </div>

<div class="form-group">
    <button type="submit">Submit</button>
</div>
      </main>
      <footer><p></p></footer>
    </div>
</body>
</html>
